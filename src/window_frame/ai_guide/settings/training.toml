# Paths are relative to the directory where you run the command (use project root).
[dataset]
root = "datasets/window_frame/train"
# Common image formats. The loader does not yet use this setting.
image_type = ["jpg", "jpeg", "png", "webp", "gif", "bmp", "tif", "tiff", "avif"]
image_size = 512
validation_fraction = 0.10
test_fraction = 0.10
# Optional JSON: {"00001": "property_a", "00002": "property_a", ...}
scene_groups = ""
# Current dataset mapping has been reviewed and confirmed by the user.
class_meanings_confirmed = true

[model]
base_channels = 32
max_correction = 0.25
confidence = 0.8

[training]
epochs = 10
# Optional sample limits after splitting; uncomment to enable (positive integers).
# Leave commented to use all available samples. The test split is unchanged.
max_train_samples = 1000
max_validation_samples = 50
# Stop after this many joint-stage epochs without sufficient validation improvement.
# 0 disables early stopping. Preparatory stages are never stopped early.
early_stopping_patience = 5
early_stopping_min_delta = 0.0001
# Skip preparatory stages: learn segmentation, classes, and enhancement together
# from epoch 1. Early stopping also starts monitoring from epoch 1.
segmentation_epochs = 0
enhancement_epochs = 0
batch_size = 7
learning_rate = 0.0003
weight_decay = 0.0001
# Auto balances CPU computation and image-loading workers.
workers = "auto"
cpu_threads = "auto"
audit_workers = "auto"
# GPU speed options (used only on CUDA).
cudnn_benchmark = true
allow_tf32 = true
channels_last = true
seed = 42
device = "auto"
mixed_precision = true
accumulation_steps = 1
# Requires: uv sync --extra dashboard
tensorboard = false

[output]
root = "output/window_frame/ai_guide"
